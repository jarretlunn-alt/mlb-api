name: daily-ingest

on:
  schedule:
    # 10:00 UTC daily (~6am ET), after the previous night's games are final
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to ingest (YYYY-MM-DD); defaults to yesterday"
        required: false

permissions:
  contents: write

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Resolve ingest date
        id: date
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            echo "date=${{ inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"
          fi

      # The DuckDB warehouse is not committed; rebuild it from the
      # committed Parquet exports so history accumulates across runs.
      - name: Restore warehouse from Parquet
        run: make restore

      - name: Ingest
        run: make ingest-date DATE=${{ steps.date.outputs.date }}

      - name: Build marts
        run: make build-marts

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: mlb-model
          path: data/models/
        continue-on-error: true

      - name: Predict
        run: python -m mlb_pipeline.cli predict --date ${{ steps.date.outputs.date }}
        continue-on-error: true

      - name: Build dashboard
        run: make dashboard

      - name: Commit curated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/marts site
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily ingest ${{ steps.date.outputs.date }} [skip ci]"
            git push
          fi
