name: Weekly model retrain

on:
  schedule:
    # Sunday at 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Restore warehouse from Parquet
        run: make restore

      - name: Train model
        run: python -m mlb_pipeline.cli train

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlb-model
          path: data/models/
          retention-days: 90
