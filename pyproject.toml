[project]
name = "mlb-pipeline"
version = "0.1.0"
description = "MLB Stats API data pipeline: raw JSON -> DuckDB -> Parquet -> static dashboard"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=0.10",
    "requests>=2.31",
    "scipy>=1.12",
    "xgboost>=2.0",
    "scikit-learn>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
